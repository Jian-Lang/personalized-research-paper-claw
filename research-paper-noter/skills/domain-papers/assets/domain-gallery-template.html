<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>
:root { --bg:#f7f7f4; --panel:#fff; --ink:#1d2523; --muted:#62706b; --line:#dfe4df; --accent:#0f766e; --accent-2:#8a4b2f; --soft:#eef5f3; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",Arial,sans-serif; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
header { padding:56px 24px 28px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#fff 0%,#f7f7f4 100%); }
.header-inner { max-width:1180px; margin:0 auto; }
.kicker { color:var(--accent-2); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
h1 { margin:10px 0 14px; font-size:clamp(34px,5vw,64px); line-height:1.04; letter-spacing:0; max-width:980px; }
.subtitle { max-width:820px; color:var(--muted); font-size:18px; margin:0; }
.stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
.stats span,.pill { display:inline-flex; align-items:center; max-width:100%; min-height:28px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:3px 10px; color:#37413e; font-size:13px; }
.layout { max-width:1180px; margin:0 auto; padding:28px 24px 64px; display:grid; grid-template-columns:280px minmax(0,1fr); gap:28px; }
aside { position:sticky; top:18px; align-self:start; max-height:calc(100vh - 36px); overflow:auto; border-right:1px solid var(--line); padding-right:18px; }
aside h2 { font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
nav { display:flex; flex-direction:column; gap:3px; } nav a { color:#34423d; padding:7px 8px; border-radius:6px; font-size:14px; line-height:1.3; } nav a:hover { background:var(--soft); text-decoration:none; }
.paper { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; margin-bottom:18px; box-shadow:0 1px 2px rgba(20,30,26,.04); }
.paper-topline { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }
.rank { flex:0 0 auto; width:34px; height:34px; display:inline-grid; place-items:center; border-radius:50%; background:var(--soft); color:var(--accent); font-weight:800; }
.meta { display:flex; min-width:0; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.paper h2 { margin:0 0 10px; font-size:24px; line-height:1.22; letter-spacing:0; }
.summary { margin:0 0 14px; font-size:17px; color:#293430; font-weight:600; }
.teaser { margin:16px 0; border:1px solid var(--line); border-radius:8px; background:#fafaf8; overflow:hidden; }
.teaser img { display:block; width:100%; max-height:420px; object-fit:contain; background:#fff; }
.links { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; min-height:4px; }
.paper-link { border:1px solid #bfd8d3; background:#f3faf8; color:#075f57; padding:5px 10px; border-radius:6px; font-size:14px; font-weight:650; }
details { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; } summary { cursor:pointer; color:var(--accent-2); font-weight:750; }
dl { display:grid; grid-template-columns:92px minmax(0,1fr); gap:10px 16px; margin:14px 0 0; } dt { color:var(--muted); font-weight:800; } dd { margin:0; }
.related { margin-top:14px; padding:12px 14px; background:#fbf6f2; border-left:3px solid var(--accent-2); color:#3d352f; }
footer { max-width:1180px; margin:0 auto; padding:0 24px 42px; color:var(--muted); font-size:14px; }
@media (max-width:860px) { header { padding-top:36px; } .layout { display:block; padding:20px 16px 44px; } aside { position:relative; top:auto; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding:0 0 18px; margin-bottom:18px; } .paper { padding:18px; } .paper h2 { font-size:21px; } .paper-topline { flex-direction:column; align-items:flex-start; gap:10px; } .meta { width:100%; justify-content:flex-start; } .subtitle,.paper h2,.summary,dd { overflow-wrap:anywhere; } dl { grid-template-columns:1fr; gap:4px; } dt { margin-top:8px; } .teaser img { max-height:320px; } }
</style>
</head>
<body>
<!-- Template adapted from jianlang8611.github.io@2361588413fae91aff31348d65a28e130f1b9f2e. -->
<header><div class="header-inner"><div class="kicker">Domain Reading Map</div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p><div class="stats">{{STATS}}</div></div></header>
<div class="layout"><aside><h2>Papers</h2><nav>{{NAV}}</nav></aside><main>{{ARTICLES}}</main></div>
<footer>{{FOOTER}}</footer>
</body>
</html>
